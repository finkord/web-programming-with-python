{% extends 'base.html' %}
{% from "macros/_macros.html" import render_field %}

{% block content %}
<div class="row mt-5">
    <div class="col-md-6 offset-md-3">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">➕ Створити нову групу</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    {{ form.hidden_tag() }}

                    {{ render_field(form.name, placeholder="Наприклад: Спортзал") }}

                    <div class="d-grid mt-4">
                        {{ form.submit(class="btn btn-success btn-lg") }}
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                <a href="{{ url_for('friends.create_friend') }}" class="text-decoration-none">Повернутися назад</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
