{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">

            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h3 class="mb-0">Підтвердження видалення</h3>
                </div>
                <div class="card-body">
                    <p class="fs-5">Ви справді хочете назавжди видалити цей пост?</p>

                    <div class="alert alert-warning" role="alert">
                        <h4 class="alert-heading">{{ post.title }}</h4>
                        <hr>
                        <p class="mb-0">Автор: {{ post.author }}</p>
                    </div>

                    <p class="text-muted">Цю дію неможливо буде скасувати.</p>

                    <form method="POST" action="{{ url_for('posts.delete', id=post.id) }}">

                        <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-secondary btn-lg">
                            Скасувати
                        </a>

                        <button type="submit" class="btn btn-danger btn-lg">
                            Так, видалити
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
