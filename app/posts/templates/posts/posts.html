{% extends 'base.html' %} {% block title %} POSTS {% endblock %} {% block
content %}

<div class="container mt-5">
  <h1 class="mb-4 text-center text-primary">Articles 📚</h1>

  <ul class="list-group">
    {% for post in posts %}

    <li
      class="list-group-item d-flex justify-content-between align-items-center mb-3 border-0 shadow-sm rounded"
    >
      <div class="h5 mb-0">
        <a
          href="{{post['id']}}"
          class="text-decoration-none text-light stretched-link"
        >
          {{ post["title"] }}
        </a>
      </div>

      <span class="badge bg-secondary rounded-pill me-3">
        ID: {{ post["id"] }}
      </span>
    </li>
    {% endfor %}
  </ul>
</div>

{% endblock %}
