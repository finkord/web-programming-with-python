{% extends 'base.html' %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <h1 class="display-1 text-danger">404</h1>
            <h2 class="mb-3">Сторінку не знайдено!</h2>
            <p class="lead mb-4">
                Нам дуже шкода, але сторінка, яку ви шукали, не існує. Можливо, вона була переміщена або видалена.
            </p>
            <a href="{{ url_for('main.resume') }}" class="btn btn-primary btn-lg">
                <i class="bi bi-house-door-fill me-2"></i> Повернутися на головну
            </a>
            <p class="mt-4 text-muted">
                Якщо ви вважаєте, що це помилка, будь ласка, зв'яжіться з нами.
            </p>
        </div>
    </div>
</div>
{% endblock %}
